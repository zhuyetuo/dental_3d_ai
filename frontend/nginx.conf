server {
    listen 80;
    root /usr/share/nginx/html;

    # 口扫文件可能有几十到上百 MB
    client_max_body_size 300m;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_read_timeout 600s;
    }

    location / {
        try_files $uri /index.html;
    }
}
