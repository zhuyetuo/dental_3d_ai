# 启动前端 + 后端（无 GPU 时，只能上传标签文件来跳过分割）：
#   docker compose up --build
# 同时启动 TGNet 分割服务（需要 NVIDIA GPU 和 nvidia-container-toolkit，权重放在 models/tgnet/）：
#   docker compose --profile gpu up --build
# 浏览器打开 http://localhost:8080

services:
  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      SEGMENTER_URL: http://tgnet:8001
      SEGMENTER_NAME: tgnet
      # 调用分割前做朝向归一化；输入已是 Teeth3DS 标准朝向时可设为 "0"
      SEGMENTER_ORIENT: "1"
      # 分割后自动做编号纠错，"0" 关闭
      NUMBERING_FIX: "1"
      # 标准牙模板库目录；里面没有对应牙位时自动用内置参数化模板
      TEMPLATE_DIR: /models/templates
    volumes:
      - case-data:/data
      - ./models/templates:/models/templates:ro
    ports:
      - "8000:8000"

  tgnet:
    profiles: ["gpu"]
    build: ./services/tgnet
    volumes:
      - ./models/tgnet:/models:ro
    ports:
      - "8001:8001"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  case-data:
