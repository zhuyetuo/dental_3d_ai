# 每次推送和 PR 自动跑全部测试。需要下载数据的真实数据测试（ml/tests/test_real_data.py 等）在 CI 里会自动跳过。
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            ml/pyproject.toml
            backend/requirements.txt
      - name: 安装依赖
        run: |
          pip install -e "ml[dev]" -r backend/requirements.txt
      - name: 算法包
        working-directory: ml
        run: pytest -q
      - name: 后端
        working-directory: backend
        run: pytest -q
      - name: TGNet 服务接口（假模型，不需要 GPU）
        run: pytest -q services/tgnet/tests

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npx vite build
